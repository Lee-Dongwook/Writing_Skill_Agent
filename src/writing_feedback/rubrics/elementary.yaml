rubric_id: summary-elementary
version: "0.1.0"
school_level: elementary
task_type: summary

criteria:
  - criterion_id: meaning_accuracy
    description: 원문의 뜻을 정확하게 이해했는지 평가합니다.
    expectation: 원문과 반대되는 설명이나 원문에 없는 주장을 구분합니다.

  - criterion_id: key_content
    description: 요약에 필요한 중심 내용을 담았는지 평가합니다.
    expectation: 과제에서 요구한 분량을 고려하고, 세부 내용의 생략을 모두 오류로 보지 않습니다.

  - criterion_id: organization
    description: 내용이 이해하기 쉬운 순서로 연결되는지 평가합니다.
    expectation: 문장 사이의 기본적인 연결을 확인하고, 의미를 유지한 다양한 구성을 인정합니다.

  - criterion_id: expression
    description: 학생의 표현이 의미를 분명하게 전달하는지 평가합니다.
    expectation: 의미 전달을 방해하는 표현을 우선 지도하고, 단순한 문체 차이를 오류로 보지 않습니다.

grade_expectations:
  1: 짧고 쉬운 지문에서 무엇에 관한 글인지 말할 수 있는 수준을 적용합니다.
  2: 중심 대상과 중요한 사실을 짧은 문장으로 나타내는 수준을 적용합니다.
  3: 중심 내용과 예시를 구분하고 중요한 내용을 골라 쓰는 수준을 적용합니다.
  4: 문단별 중심 내용을 연결하고 반복되는 설명을 줄이는 수준을 적용합니다.
  5: 원인과 결과를 구분하고 중심 내용과 중요한 조건을 함께 담는 수준을 적용합니다.
  6: 글 전체의 구조를 고려하고 핵심 설명의 조건과 한계를 유지하는 수준을 적용합니다.

feedback_guidance: >-
  쉬운 낱말과 짧은 문장을 사용합니다.
  요청에 포함된 학년에 맞춰 질문의 난도를 조절합니다.
  한 번에 하나의 수정 행동을 안내하고, 학생의 능력이나 성격을 단정하지 않습니다.
